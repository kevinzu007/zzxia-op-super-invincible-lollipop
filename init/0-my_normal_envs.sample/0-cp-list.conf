# 配置文件清单
# 格式: 源文件基础名(不带环境后缀)  目标路径
# 目标路径支持环境变量 ${DEST_DIR}
# 程序会自动优先查找 "源文件名---${R_ENV}", 如果找不到则使用 "源文件名"

# --- Ansible 相关 ---
ansible-inventory                                  /etc/ansible/inventories/

# --- 系统配置 ---
zzxia-op-super-invincible-lollipop.run-env.sh      /etc/profile.d/
zzxia-op-super-invincible-lollipop.run-env.sh      ${DEST_DIR}/init/2-os-base/
mailrc                                             ${DEST_DIR}/init/2-os-base/
host-ip.list                                       ${DEST_DIR}/init/

# --- Fuckingdoit (项目主目录) ---
env.sh                                             ${DEST_DIR}/fuckingdoit/
project.list                                       ${DEST_DIR}/fuckingdoit/
project.list.append.1                              ${DEST_DIR}/fuckingdoit/
docker-cluster-service.list                        ${DEST_DIR}/fuckingdoit/
docker-cluster-service.list.append.1               ${DEST_DIR}/fuckingdoit/
docker-cluster-service.list.append.2               ${DEST_DIR}/fuckingdoit/
docker-arg-pub.list                                ${DEST_DIR}/fuckingdoit/
container-hosts-pub.list                           ${DEST_DIR}/fuckingdoit/
java-options-pub.list                              ${DEST_DIR}/fuckingdoit/
nginx.list                                         ${DEST_DIR}/fuckingdoit/

# --- 其他服务配置 ---
nginx.list                                         ${DEST_DIR}/init/nginx/nginx-config/
pg_db.list                                         ${DEST_DIR}/init/pg/manage/
pgbadger.env                                       ${DEST_DIR}/init/pgbadger/pgbadger_report/
