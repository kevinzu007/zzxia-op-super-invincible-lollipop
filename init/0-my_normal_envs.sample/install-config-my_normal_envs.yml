# 须带环境变量运行：
# ansible-playbook install-config-my_normal_envs.yml -e "RUN_ENV=${RUN_ENV}" -e "DEST_DIR=${DEST_DIR}"

# --- Play 1: 本地配置 (ansible.cfg 等) ---
- hosts: localhost
  gather_facts: no
  become: no  # 拷贝到用户目录通常不需要 root，视具体 dest 而定
  vars:
    - RUN_ENV: "{{ lookup('env','RUN_ENV') }}"
    - DEST_DIR: "{{ lookup('env','DEST_DIR') }}"
    - conf: "{{ lookup('file', '0-normal-config-list.yml') | from_yaml }}"
  
  tasks:
    - name: 确保 ~/.ansible 目录存在
      file:
        path: ~/.ansible
        state: directory
        mode: '0755'

    - name: 分发本地配置 (Localhost)
      copy:
        # 优先查找 src--ENV，否则 src
        src: "{{ lookup('first_found', params) }}"
        dest: "{{ item.dest }}"
        force: yes
      vars:
        params:
          files:
            - "{{ item.src }}--{{ RUN_ENV }}"
            - "{{ item.src }}"
          paths:
            - "{{ playbook_dir }}"
      loop: "{{ conf.localhost.files | default([]) }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.dest }}"

# --- Play 2: 部署主机配置 (deploy 组) ---
- hosts: deploy
  gather_facts: no
  become: yes
  vars:
    - RUN_ENV: "{{ lookup('env','RUN_ENV') }}"
    - DEST_DIR: "{{ lookup('env','DEST_DIR') }}"
    - conf: "{{ lookup('file', '0-normal-config-list.yml') | from_yaml }}"
  
  tasks:
    - name: 检查必要变量
      fail:
        msg: "必须指定 RUN_ENV 和 DEST_DIR 环境变量！"
      when: RUN_ENV == "" or DEST_DIR == ""

    - name: 分发部署配置 (Deploy)
      copy:
        src: "{{ lookup('first_found', params) }}"
        dest: "{{ item.dest }}"
        force: yes
      vars:
        params:
          files:
            - "{{ item.src }}--{{ RUN_ENV }}"
            - "{{ item.src }}"
          paths:
            - "{{ playbook_dir }}"
      loop: "{{ conf.deploy.files | default([]) }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.dest }}"
